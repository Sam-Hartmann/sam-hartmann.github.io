{% if site.google_analytics and site.google_analytics != "" %}
<!--
  Cookie consent banner – shown only when the visitor has not yet made a choice.
  Accepts / declines analytics cookies (GA4).  No third-party script is needed.
-->
<div id="cookie-banner" class="cookie-banner" role="dialog" aria-live="polite"
     aria-label="Cookie consent" style="display:none;">
  <p class="cookie-banner__text">
    This site uses cookies from Google Analytics to understand how visitors use
    the site. No personally identifiable information is collected.
    See our <a href="{{ '/privacy-policy/' | relative_url }}">Privacy&nbsp;Policy</a>
    and <a href="https://policies.google.com/privacy" target="_blank"
           rel="noopener noreferrer">Google's Privacy Policy</a> for details.
  </p>
  <div class="cookie-banner__actions">
    <button id="cookie-accept" class="cookie-banner__btn cookie-banner__btn--accept">
      Accept cookies
    </button>
    <button id="cookie-decline" class="cookie-banner__btn cookie-banner__btn--decline">
      Decline
    </button>
  </div>
</div>

<script>
(function () {
  var STORAGE_KEY = 'cookie_consent';
  var banner = document.getElementById('cookie-banner');

  // If the visitor has not yet decided, show the banner.
  if (!localStorage.getItem(STORAGE_KEY)) {
    banner.style.display = '';
  }

  function setConsent(granted) {
    localStorage.setItem(STORAGE_KEY, granted ? 'granted' : 'denied');
    if (granted && typeof gtag === 'function') {
      gtag('consent', 'update', { 'analytics_storage': 'granted' });
    }
    banner.style.display = 'none';
  }

  document.getElementById('cookie-accept').addEventListener('click', function () {
    setConsent(true);
  });

  document.getElementById('cookie-decline').addEventListener('click', function () {
    setConsent(false);
  });
})();
</script>
{% endif %}
