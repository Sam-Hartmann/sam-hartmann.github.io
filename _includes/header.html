<header class="site-header">
  <div class="site-header__inner">

    <!-- Logo -->
    <a href="{{ '/' | relative_url }}" class="site-logo">{{ site.title }}</a>

    <!-- Search -->
    <div class="search-wrap">
      <form class="search-form" id="search-form" role="search">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input
          type="search"
          id="search-input"
          class="search-form__input"
          placeholder="Search stories…"
          autocomplete="off"
          aria-label="Search stories"
        >
      </form>
      <ul class="search-suggestions" id="search-suggestions" role="listbox" aria-label="Suggestions" hidden></ul>
    </div>

    <!-- Actions -->
    <nav class="site-header__actions" aria-label="Site actions">
      {% if site.links.medium and site.links.medium != "" %}
      <a href="{{ site.links.medium }}" target="_blank" rel="noopener" class="header-link">Medium</a>
      {% endif %}
      {% if site.links.etsy and site.links.etsy != "" %}
      <a href="{{ site.links.etsy }}" target="_blank" rel="noopener" class="btn btn--sm">Shop</a>
      {% endif %}
    </nav>

  </div>
</header>
